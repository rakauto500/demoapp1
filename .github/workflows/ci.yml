# CI: build and run the full UI suite against the embedded server on every
# pull request and every push to a branch other than main (main is handled by cd.yml).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run (Chrome, Firefox, Edge)
        default: Chrome
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      UITEST_Test__Browser: ${{ github.event.inputs.browser || 'Chrome' }}
      UITEST_Test__Headless: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # GitHub-hosted Ubuntu runners ship Chrome, Firefox and Edge; Selenium Manager
      # resolves the matching driver automatically.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=ui-tests.trx"
          --logger "console;verbosity=normal"

      # Open index.html from the downloaded artifact for the dashboard.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            TestResults/report/**
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/artifacts/**
          if-no-files-found: ignore
