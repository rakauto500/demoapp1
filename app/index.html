<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DemoApp - Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>DemoApp</h1>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" data-test="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" data-test="password">
      <button id="login-button" type="submit" data-test="login-button">Sign in</button>
      <p id="error" class="error" role="alert" data-test="error" hidden></p>
    </form>
    <p class="hint">Demo user: <code>demo</code> / <code>secret123</code></p>
  </main>
  <script src="app.js"></script>
  <script>DemoApp.initLogin();</script>
</body>
</html>
